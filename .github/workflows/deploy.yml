name: Build Docker image, publish to ECR, deploy with SSH

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}

jobs:
  validate:
    name: Validate pull request
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: portfolio:pull-request

  publish:
    name: Publish merged image
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    environment: "CD Env"
    env:
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check out merged source
        uses: actions/checkout@v4
        with:
          ref: main # Explicitly checkout main instead of merge_commit_sha

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image name
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: echo "image=$REGISTRY/$ECR_REPOSITORY:$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

  deploy:
    name: Deploy through SSM
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    environment: "CD Env"
    env:
      IMAGE: ${{ needs.publish.outputs.image }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Deploy through SSM
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          test -n "$EC2_INSTANCE_ID" || { echo "EC2_INSTANCE_ID is empty" >&2; exit 1; }

          remote_script=$(cat <<EOF
          set -eu
          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          docker pull "$IMAGE"
          docker rm -f portfolio 2>/dev/null || true
          mkdir -p "$DEPLOY_PATH"
          docker run -d --name portfolio --restart unless-stopped -p "$DEPLOY_PORT:8080" "$IMAGE"
          docker image prune -f
          EOF
          )

          parameters=$(jq -n --arg script "$remote_script" '{commands: [$script]}')
          command_id=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy portfolio $GITHUB_SHA" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command: $command_id"
          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
