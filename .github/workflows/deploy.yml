name: Build Docker image, publish to ECR, deploy with SSH

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}

jobs:
  validate:
    name: Validate pull request
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: portfolio:pull-request

  publish:
    name: Publish merged image
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    environment: "CD Env"
    env:
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check out merged source
        uses: actions/checkout@v4
        with:
          ref: main # Explicitly checkout main instead of merge_commit_sha

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image name
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: echo "image=$REGISTRY/$ECR_REPOSITORY:$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

  deploy:
    name: Deploy over SSH
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    environment: "CD Env"
    env:
      IMAGE: ${{ needs.publish.outputs.image }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
    steps:
      - name: Create deployment marker
        run: |
          mkdir -p .deploy
          touch .deploy/marker

      - name: Deploy with SSH
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        uses: easingthemes/ssh-deploy@v6.0.1
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: "22"
          SOURCE: ".deploy/marker"
          TARGET: "/tmp/portfolio-deploy/"
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no"
          SCRIPT_AFTER_REQUIRED: true
          SCRIPT_AFTER: |
            set -eu
            registry="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
            aws ecr get-login-password --region "${{ env.AWS_REGION }}" | docker login --username AWS --password-stdin "$registry"
            docker pull "${{ env.IMAGE }}"
            docker rm -f portfolio 2>/dev/null || true
            mkdir -p "${{ env.DEPLOY_PATH }}"
            docker run -d --name portfolio --restart unless-stopped -p "${{ env.DEPLOY_PORT }}:8080" "${{ env.IMAGE }}"
            docker image prune -f
