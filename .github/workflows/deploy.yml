name: Build Docker image, publish to ECR, deploy with SSH

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}

jobs:
  validate:
    name: Validate pull request
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: portfolio:pull-request

  publish:
    name: Publish merged image
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    environment: "CD Env"
    env:
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check out merged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image name
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: echo "image=$REGISTRY/$ECR_REPOSITORY:${{ github.event.pull_request.merge_commit_sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

  deploy:
    name: Deploy over SSH
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    environment: "CD Env"
    env:
      IMAGE: ${{ needs.publish.outputs.image }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      RUNTIME_ENV_FILE: ${{ secrets.RUNTIME_ENV_FILE }}
    steps:
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Pull and run image
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          printf '%s' "$RUNTIME_ENV_FILE" | ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "set -eu
            umask 077
            mkdir -p '$DEPLOY_PATH'
            aws ecr get-login-password --region '$AWS_REGION' | docker login --username AWS --password-stdin '$registry'
            docker pull '$IMAGE'
            docker rm -f portfolio 2>/dev/null || true
            docker run -d --name portfolio --restart unless-stopped -p '$DEPLOY_PORT:8080' '$IMAGE'
            docker image prune -f"
